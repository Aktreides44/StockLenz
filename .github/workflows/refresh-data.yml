# Builds a fresh database every weekday and publishes it, so the API on Render can download it.
#
# What happens, in order:
#   1. tests run (if they fail, nothing is published)
#   2. the pipeline downloads SEC data and prices and builds stocklens.db
#      (the raw SEC files are kept between runs in the Actions cache; only companies with
#       new 10-K/10-Q filings are downloaded again, see backend/pipeline/sec_updates.py)
#   3. a sanity check makes sure the result is not broken
#   4. a coverage report (which companies miss which numbers, and why) is written
#   5. stocklens.db and coverage.md are uploaded to the GitHub release "data-latest", replacing yesterday's
#
# Needs the repository secrets SEC_USER_AGENT and POLYGON_API_KEY
# (Settings -> Secrets and variables -> Actions).

name: Refresh data

on:
  schedule:
    # 22:30 UTC, Monday to Friday: after the US market closes (16:00 New York time).
    - cron: "30 22 * * 1-5"
  workflow_dispatch: # adds a "Run workflow" button on GitHub, to start it by hand
    inputs:
      backfill_days:
        description: "Older price days to fetch for the price chart (12 s each; 260 fills a whole year)"
        default: "25"

permissions:
  contents: write # needed to upload the file to the release

concurrency:
  group: refresh-data # never run two refreshes at the same time

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75 # a by-hand run with a big price backfill can take almost an hour
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install packages
        run: pip install -r requirements.txt

      # Restores the SEC files saved by the last run, and saves them again when this run succeeds.
      # Every run saves a new cache entry (the key contains the run id); restore-keys picks the newest.
      # GitHub deletes entries unused for 7 days and the oldest ones above 10 GB.
      - name: Restore the saved SEC files
        uses: actions/cache@v4
        with:
          path: backend/data/raw
          key: sec-raw-${{ github.run_id }}
          restore-keys: sec-raw-

      - name: Run tests
        run: python -m pytest -q

      # The price chart's history lives in the published database: start from yesterday's.
      # (On the very first run there is none yet; the history then starts empty.)
      - name: Get yesterday's database (for the price history)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download data-latest --pattern stocklens.db --dir data || echo "No earlier database"

      - name: Build the database
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          PRICE_BACKFILL_DAYS: ${{ inputs.backfill_days || '25' }} # scheduled runs: 25
        run: python -m pipeline.refresh

      - name: Check the database before publishing
        run: python -m pipeline.check_database

      - name: Write the coverage report
        run: python -m pipeline.coverage

      - name: Publish it as the "data-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view data-latest > /dev/null 2>&1; then
            gh release create data-latest --latest=false --title "Daily data" \
              --notes "Built automatically by the Refresh data workflow. Not a code release."
          fi
          gh release upload data-latest data/stocklens.db data/coverage.md --clobber
